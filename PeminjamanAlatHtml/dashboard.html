<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kaze - Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<style>
.header{align-items:center}.account{display:flex;align-items:center;gap:15px}.account .logo{width:100px;height:100px}.balance-box{height:115px;min-width:55%;border:3px solid #000;border-radius:22px;padding:8px 30px;display:flex;align-items:center;justify-content:space-between}.balance-title{font-size:30px;font-weight:700}.balance-value{font-size:31px}.topup,.settings{height:70px;padding:0 30px;background:#fff;border:3px solid #000;border-radius:40px;font-size:28px;font-weight:700}.actions{display:flex;align-items:center;gap:25px}
.shop{background:#000;border-radius:22px;padding:32px 27px;min-height:670px}.search{width:55%;height:90px;border:0;border-radius:20px;padding:0 25px;font-size:27px;margin-bottom:30px}.categories{display:flex;background:#fff;border-radius:20px;overflow:auto;margin-bottom:18px}.cat{border:0;background:#fff;padding:18px 25px;font-size:26px;white-space:nowrap;cursor:pointer}.cat.active{font-weight:700;text-decoration:underline}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.card{background:#fff;border-radius:18px;min-height:190px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;transition:transform 0.2s}.card:hover{transform:translateY(-4px)}

/* Styling Ikon Baru */
.item-icon{width:100%;height:120px;border:3px solid #000;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#f8f9fa}
.item-icon svg{width:58px;height:58px;stroke:#000;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item-name{font-size:15px;font-weight:700;text-align:center;margin-top:8px;color:#000;line-height:1.2}

@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.balance-box{min-width:45%}.search{width:70%}}
@media(max-width:650px){.header{height:auto;gap:12px;align-items:flex-start}.balance-box{display:none}.actions{gap:7px}.topup,.settings{height:48px;padding:0 14px;font-size:17px}.shop{padding:15px;min-height:600px}.search{width:100%;height:55px;font-size:18px;margin-bottom:15px}.cat{font-size:16px;padding:13px}.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:160px}.item-icon{height:100px}.item-icon svg{width:46px;height:46px}}
</style>
</head>
<body>

<header class="header">
  <div class="account" onclick="go('profile.html')" role="button" tabindex="0" title="Open Profile">
    <div class="logo">K</div>
    <div>
      <div class="name" id="headerName">Kaze</div>
      <div class="user-id" id="headerId">061108</div>
    </div>
  </div>
  <div class="balance-box">
    <div>
      <div class="balance-title">Your balance</div>
      <div class="balance-value" id="balance"></div>
    </div>
    <button class="topup" onclick="go('topup.html')">TopUp</button>
  </div>
  <div class="actions">
    <button class="settings" onclick="go('settings.html')">Settings</button>
  </div>
</header>

<main class="panel black-panel shop">
  <input class="search" id="search" placeholder="Type what you are looking for here...." oninput="render()">
  <div class="categories" id="categories"></div>
  <div class="grid" id="grid"></div>
</main>

<script src="js/app.js"></script>
<script>
const data={
Monitor:["Samsung Monitor","LG Monitor","ASUS Monitor","Acer Monitor","Dell Monitor","Lenovo Monitor","ViewSonic Monitor","MSI Monitor","BenQ Monitor","AOC Monitor","Philips Monitor","HP Monitor","Xiaomi Monitor","Huawei Monitor"],
Laptop:["ASUS Vivobook","Acer Aspire","Lenovo IdeaPad","HP Pavilion","Dell Inspiron","MSI Modern","MacBook","ASUS TUF","Acer Nitro","Lenovo LOQ","HP Victus","Dell Latitude","ASUS Zenbook","Acer Swift"],
Mouse:["Logitech Mouse","Razer Mouse","Fantech Mouse","Microsoft Mouse","HP Mouse","A4Tech Mouse","SteelSeries Mouse","Corsair Mouse","Lenovo Mouse","ASUS Mouse","Dareu Mouse","VXE Mouse","Rexus Mouse","NYK Mouse"],
Keyboard:["Mechanical Keyboard","Gaming Keyboard","Logitech Keyboard","Razer Keyboard","Fantech Keyboard","A4Tech Keyboard","Keychron Keyboard","Royal Kludge Keyboard","Dareu Keyboard","Rexus Keyboard","Vortex Keyboard","ASUS Keyboard","HP Keyboard","Lenovo Keyboard"],
PC:["Gaming PC","Office PC","Mini PC","Editing PC","Streaming PC","Design PC","Workstation PC","Intel PC","Ryzen PC","Acer PC","ASUS PC","HP PC","Lenovo PC","Dell PC"],
PlayStation:["PlayStation V","PlayStation 4","PlayStation 4 Slim","PlayStation 4 Pro","PlayStation 5 Slim","PlayStation 5 Digital","PlayStation 5 Pro","PS VR","PS Controller Set","PS Racing Set","PS Media Set","PS5 Game Set","PS4 Game Set","PlayStation Bundle"],
Controller:["PS Controller","Xbox Controller","Nintendo Controller","Fantech Controller","Rexus Controller","8BitDo Controller","Logitech Controller","GameSir Controller","DualSense","DualShock 4","Xbox Series Controller","Switch Pro Controller","Generic Controller","Arcade Controller"]
};

const cats=["All",...Object.keys(data)];
let current="All";

document.getElementById("balance").textContent=money(getBalance());
const dashboardProfile=getProfile();
document.getElementById("headerName").textContent=dashboardProfile.name;
document.getElementById("headerId").textContent=dashboardProfile.id;

// Fungsi pembuat ikon SVG berdasarkan tipe alat
function getIconSVG(name){
  const c = name.toLowerCase();
  
  if(c.includes("playstation") || c.includes("ps")){
    return `<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><line x1="3" y1="12" x2="21" y2="12"/><circle cx="7.5" cy="9.5" r="1" fill="#000"/><circle cx="16.5" cy="14.5" r="1" fill="#000"/></svg>`;
  }
  if(c.includes("laptop") || c.includes("macbook")){
    return `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/><path d="M9 16v1h6v-1"/></svg>`;
  }
  if(c.includes("mouse")){
    return `<svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 3v5"/><path d="M6 9h12"/></svg>`;
  }
  if(c.includes("keyboard")){
    return `<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"/></svg>`;
  }
  if(c.includes("monitor")){
    return `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="13" rx="2"/><path d="M8 21h8M12 16v5"/></svg>`;
  }
  if(c.includes("controller")){
    return `<svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 10h.01M17 12h.01"/><path d="M17.5 6h-11A4.5 4.5 0 0 0 2 10.5v3A3.5 3.5 0 0 0 5.5 17a3.5 3.5 0 0 0 3.12-1.92L9.5 13h5l.88 2.08A3.5 3.5 0 0 0 18.5 17a3.5 3.5 0 0 0 3.5-3.5v-3A4.5 4.5 0 0 0 17.5 6z"/></svg>`;
  }
  // Default PC Tower
  return `<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="6" r="1.5" fill="#000"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="14" x2="16" y2="14"/><circle cx="12" cy="18" r="1" fill="#000"/></svg>`;
}

function renderCats(){
  document.getElementById("categories").innerHTML=cats.map(c=>`<button class="cat ${c===current?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}

function setCat(c){
  current=c;
  render();
}

function render(){
  renderCats();
  const q=document.getElementById("search").value.toLowerCase();
  let items=current==="All"?Object.entries(data).flatMap(([cat,arr])=>arr.map(name=>({cat,name}))):data[current].map(name=>({cat:current,name}));
  items=items.filter(x=>x.name.toLowerCase().includes(q));
  
  document.getElementById("grid").innerHTML=items.map(x=>`
    <div class="card" onclick="borrow('${x.name.replace(/'/g,"\\'")}')">
      <div class="item-icon">${getIconSVG(x.name)}</div>
      <div class="item-name">${x.name}</div>
    </div>
  `).join("")||'<div style="color:white;font-size:22px;padding:20px">Barang tidak ditemukan.</div>';
}

function borrow(name){
  localStorage.setItem("kazeSelectedItem",name);
  go("peminjaman.html");
}

render();

function go(page){
  window.location.href=page;
}
</script>
</body>
</html>
