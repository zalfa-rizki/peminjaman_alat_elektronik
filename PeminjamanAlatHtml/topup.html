<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kaze - Settings</title>
<link rel="stylesheet" href="css/style.css">
<style>
.settings-page{margin:15px 1.7% 30px;border:3px solid #000;border-radius:22px;min-height:650px;padding:25px;background:#fff}
.settings-title{font-size:48px;font-weight:700;margin-bottom:35px}
.settings-list{width:430px;display:flex;flex-direction:column;gap:16px}
.setting-btn{width:100%;height:68px;background:#fff;border:3px solid #000;border-radius:20px;font-size:28px;font-weight:500;cursor:pointer;transition:.15s}
.setting-btn:hover{background:#000;color:#fff}
.setting-btn.active{background:#000;color:#fff}.profile-link{margin-bottom:2px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-backdrop.show{display:flex}
.modal{width:min(520px,100%);background:#fff;color:#000;border:3px solid #000;border-radius:22px;padding:25px}
.modal h2{font-size:32px;margin-bottom:14px}.modal p{font-size:20px;line-height:1.5;margin-bottom:20px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}.modal button{padding:12px 22px;border:2px solid #000;border-radius:30px;background:#fff;font-weight:700}
.modal .close{background:#000;color:#fff}
.status{font-size:17px;margin-top:25px;color:#555}
@media(max-width:650px){
 .settings-page{margin:10px;min-height:600px;padding:18px;border-radius:16px}
 .settings-title{font-size:36px;margin-bottom:25px}
 .settings-list{width:100%;gap:13px}.setting-btn{height:58px;font-size:22px;border-radius:16px}
}
</style>
</head>
<body>
<header class="header">
  <div class="profile" onclick="go('profile.html')" role="button" tabindex="0" title="Open Profile">
    <div class="logo">K</div>
    <div><div class="name" id="headerName">Kaze</div><div class="user-id" id="headerId">061108</div></div>
  </div>
  <button class="back" onclick="go('dashboard.html')">Back</button>
</header>

<main class="settings-page">
  <h1 class="settings-title" data-en="Settings" data-id="Pengaturan">Settings</h1>
  <div class="settings-list">
    <button class="setting-btn profile-link" onclick="go('profile.html')">Profile</button>
    <button class="setting-btn" id="notificationBtn" onclick="toggleNotifications()">Notifications</button>
    <button class="setting-btn" id="languageBtn" onclick="toggleLanguage()">Language</button>
    <button class="setting-btn" id="darkModeBtn" onclick="toggleDarkMode()">Dark mode</button>
    <button class="setting-btn" onclick="showModal('about')">About</button>
    <button class="setting-btn" onclick="showModal('help')">Help</button>
    <button class="setting-btn" onclick="logout()">Logout</button>
  </div>
  <div class="status" id="status"></div>
</main>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="modal-actions"><button class="close" onclick="hideModal()">Close</button></div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
const settingsProfile=getProfile();
document.getElementById("headerName").textContent=settingsProfile.name;
document.getElementById("headerId").textContent=settingsProfile.id;

function refreshSettings(){
  const notif=localStorage.getItem('kazeNotifications')!=='off';
  const lang=localStorage.getItem('kazeLanguage')||'en';
  const dark=localStorage.getItem('kazeDarkMode')==='on';
  document.getElementById('notificationBtn').textContent=lang==='id'?'Notifikasi: '+(notif?'Aktif':'Nonaktif'):'Notifications: '+(notif?'On':'Off');
  document.getElementById('languageBtn').textContent=lang==='id'?'Language: Indonesia':'Language: English';
  document.getElementById('darkModeBtn').textContent=lang==='id'?'Mode gelap: '+(dark?'Aktif':'Nonaktif'):'Dark mode: '+(dark?'On':'Off');
  document.getElementById('notificationBtn').classList.toggle('active',notif);
  document.getElementById('darkModeBtn').classList.toggle('active',dark);
  document.getElementById('status').textContent=lang==='id'?'Pengaturan tersimpan otomatis.':'Settings are saved automatically.';
}
function toggleNotifications(){
  const on=localStorage.getItem('kazeNotifications')!=='off';
  localStorage.setItem('kazeNotifications',on?'off':'on');
  refreshSettings();
}
function toggleLanguage(){
  const lang=localStorage.getItem('kazeLanguage')||'en';
  localStorage.setItem('kazeLanguage',lang==='en'?'id':'en');
  applyLanguage(); refreshSettings();
}
function applyLanguage(){
  const lang=localStorage.getItem('kazeLanguage')||'en';
  document.documentElement.lang=lang==='id'?'id':'en';
  const title=document.querySelector('[data-en]');
  if(title) title.textContent=lang==='id'?title.dataset.id:title.dataset.en;
}
function toggleDarkMode(){
  const on=localStorage.getItem('kazeDarkMode')==='on';
  localStorage.setItem('kazeDarkMode',on?'off':'on');
  applyTheme(); refreshSettings();
}
function showModal(type){
  const lang=localStorage.getItem('kazeLanguage')||'en';
  const data={
    about:lang==='id'?['Tentang','Kaze Electronic Equipment Rental adalah website sederhana untuk menyewa perangkat elektronik.']:[ 'About','Kaze Electronic Equipment Rental is a simple website for renting electronic equipment.'],
    help:lang==='id'?['Bantuan','Pilih perangkat di Dashboard, atur durasi peminjaman, lalu ikuti prosesnya. Gunakan TopUp untuk menambah saldo.']:[ 'Help','Choose an item from Dashboard, set the rental duration, then follow the rental process. Use TopUp to add balance.']
  };
  document.getElementById('modalTitle').textContent=data[type][0];
  document.getElementById('modalText').textContent=data[type][1];
  document.getElementById('modalBackdrop').classList.add('show');
}
function hideModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function closeModal(e){if(e.target.id==='modalBackdrop')hideModal()}
function logout(){
  if(confirm((localStorage.getItem('kazeLanguage')==='id')?'Keluar dari akun?':'Log out from this account?')) go('login.html');
}
applyTheme();
applyLanguage();
refreshSettings();
</script>
</body>
</html>
